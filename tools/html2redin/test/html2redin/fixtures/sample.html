<!doctype html>
<html>
<head>
  <title>Sample</title>
  <style>
    .toolbar { display: flex; flex-direction: row; gap: 8px; padding: 8px; background-color: #2e3440; }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <button class="btn" id="save">Save</button>
      <button class="btn">Load</button>
    </div>
    <div class="content">
      <h1 class="title">Notes</h1>
      <p>Type &amp; save.</p>
      <input type="text" placeholder="Search...">
      <span>Unsaved changes</span>
      <table>
        <tr><td>Name</td><td>Ready</td></tr>
      </table>
    </div>
  </div>
</body>
</html>
